<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <h1 class="page-title">Your Cart</h1>
    <div id="cart"></div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const cartEl = document.getElementById('cart');

    function renderCart() {
      const cart = getCart();

      if (cart.length === 0) {
        cartEl.innerHTML = `
          <div class="empty">
            <p>Your cart is empty.</p><br>
            <a class="btn" href="index.html">Continue shopping</a>
          </div>`;
        return;
      }

      cartEl.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr>
            </thead>
            <tbody>
              ${cart.map((i) => `
                <tr>
                  <td>
                    <div style="display:flex;align-items:center;gap:12px;">
                      <img src="${escapeHtml(i.image)}" alt="" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">
                      <a href="product.html?id=${i.productId}">${escapeHtml(i.name)}</a>
                    </div>
                  </td>
                  <td>${formatPrice(i.price)}</td>
                  <td>
                    <input type="number" class="qty-input" data-id="${i.productId}"
                      value="${i.qty}" min="1" max="${i.stock}"
                      style="width:70px;padding:6px;border:1px solid var(--border);border-radius:6px;">
                  </td>
                  <td>${formatPrice(i.price * i.qty)}</td>
                  <td><button class="btn btn-danger" data-remove="${i.productId}">Remove</button></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="summary">
          <h3>Total: ${formatPrice(cartTotal())}</h3>
          <a class="btn" href="checkout.html">Proceed to checkout</a>
          <button class="btn btn-outline" id="clear-btn">Clear cart</button>
        </div>`;
    }

    cartEl.addEventListener('change', (e) => {
      const input = e.target.closest('.qty-input');
      if (!input) return;
      let qty = parseInt(input.value, 10);
      if (!Number.isInteger(qty) || qty < 1) qty = 1;
      updateCartQty(input.dataset.id, qty);
      renderCart();
    });

    cartEl.addEventListener('click', (e) => {
      const removeBtn = e.target.closest('[data-remove]');
      if (removeBtn) {
        removeFromCart(removeBtn.dataset.remove);
        renderCart();
        return;
      }
      if (e.target.id === 'clear-btn') {
        clearCart();
        renderCart();
      }
    });

    renderCart();
  </script>
</body>
</html>
