<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <div class="form-box">
      <h2>Login</h2>
      <div id="message" class="message"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn" id="submit-btn">Login</button>
      </form>

      <p class="form-footer">New here? <a href="register.html" id="register-link">Create an account</a></p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    // only allow simple page names like "checkout.html"
    const nextPage = redirect && /^[\w-]+\.html$/.test(redirect) ? redirect : 'index.html';

    if (getUser()) window.location.href = nextPage;

    if (redirect) {
      document.getElementById('register-link').href = 'register.html?redirect=' + encodeURIComponent(nextPage);
    }

    const form = document.getElementById('login-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.className = 'message';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const user = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        saveUser(user);
        window.location.href = nextPage;
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'message error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
