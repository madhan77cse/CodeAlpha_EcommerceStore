<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - My Orders</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <h1 class="page-title">My Orders</h1>
    <div id="orders"></div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const ordersEl = document.getElementById('orders');

    // must be logged in
    if (!getUser()) {
      window.location.href = 'login.html?redirect=orders.html';
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleString('en-IN', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
    }

    function statusColor(status) {
      if (status === 'delivered') return 'var(--success)';
      if (status === 'shipped' || status === 'paid') return 'var(--primary)';
      return 'var(--muted)';
    }

    async function loadOrders() {
      try {
        const orders = await api('/orders/mine');

        if (orders.length === 0) {
          ordersEl.innerHTML = `
            <div class="empty">
              <p>You haven't placed any orders yet.</p><br>
              <a class="btn" href="index.html">Start shopping</a>
            </div>`;
          return;
        }

        ordersEl.innerHTML = orders.map((o) => `
          <div class="form-box" style="max-width:none;margin:0 0 20px 0;">
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
              <div>
                <strong>Order #${escapeHtml(o._id.slice(-8).toUpperCase())}</strong><br>
                <span style="color:var(--muted);font-size:0.85rem;">${formatDate(o.createdAt)}</span>
              </div>
              <div style="text-align:right;">
                <span style="font-weight:700;color:${statusColor(o.status)};text-transform:capitalize;">${escapeHtml(o.status)}</span><br>
                <strong>${formatPrice(o.totalPrice)}</strong>
              </div>
            </div>

            ${o.items.map((i) => `
              <div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;">
                <span>${escapeHtml(i.name)} &times; ${i.qty}</span>
                <span>${formatPrice(i.price * i.qty)}</span>
              </div>`).join('')}

            <hr style="border:none;border-top:1px solid var(--border);margin:12px 0;">
            <p style="font-size:0.85rem;color:var(--muted);">
              Ship to: ${escapeHtml(o.shippingAddress.fullName)}, ${escapeHtml(o.shippingAddress.address)},
              ${escapeHtml(o.shippingAddress.city)} - ${escapeHtml(o.shippingAddress.postalCode)}
            </p>
          </div>`).join('');
      } catch (err) {
        if (err.message.startsWith('Not authorized')) {
          localStorage.removeItem('user');
          window.location.href = 'login.html?redirect=orders.html';
          return;
        }
        ordersEl.innerHTML = `<p class="empty">${escapeHtml(err.message)}</p>`;
      }
    }

    loadOrders();
  </script>
</body>
</html>
