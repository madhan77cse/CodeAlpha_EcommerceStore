<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <div class="form-box">
      <h2>Create an account</h2>
      <div id="message" class="message"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password (at least 6 characters)</label>
          <input type="password" id="password" minlength="6" required>
        </div>
        <button type="submit" class="btn" id="submit-btn">Register</button>
      </form>

      <p class="form-footer">Already have an account? <a href="login.html" id="login-link">Login</a></p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    // only allow simple page names like "checkout.html"
    const nextPage = redirect && /^[\w-]+\.html$/.test(redirect) ? redirect : 'index.html';

    if (getUser()) window.location.href = nextPage;

    if (redirect) {
      document.getElementById('login-link').href = 'login.html?redirect=' + encodeURIComponent(nextPage);
    }

    const form = document.getElementById('register-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.className = 'message';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const user = await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        saveUser(user);
        window.location.href = nextPage;
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'message error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register';
      }
    });
  </script>
</body>
</html>
